name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and deploy
        uses: ./.github/actions/tf-deploy
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_MAP: ${{ vars.MODEL_MAP }}

  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      account_a_id: ${{ steps.org.outputs.ACCOUNT_A_ID }}
      account_b_id: ${{ steps.org.outputs.ACCOUNT_B_ID }}
      account_c_id: ${{ steps.org.outputs.ACCOUNT_C_ID }}
      account_d_id: ${{ steps.org.outputs.ACCOUNT_D_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check deploy role
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN (run ./scripts/setup-gha-oidc-role.sh)."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or reuse accounts A–D
        id: org
        run: ./scripts/bootstrap-org.sh

  deploy-members:
    name: Deploy member ${{ matrix.account }}
    needs: bootstrap
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: a
            id: ${{ needs.bootstrap.outputs.account_a_id }}
          - account: b
            id: ${{ needs.bootstrap.outputs.account_b_id }}
          - account: c
            id: ${{ needs.bootstrap.outputs.account_c_id }}
          - account: d
            id: ${{ needs.bootstrap.outputs.account_d_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and deploy
        uses: ./.github/actions/tf-deploy
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          member-role-arn: arn:aws:iam::${{ matrix.id }}:role/OrganizationAccountAccessRole
          role-session-name: gha-deploy-${{ matrix.account }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_MAP: ${{ vars.MODEL_MAP }}
