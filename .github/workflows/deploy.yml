name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and deploy
        uses: ./.github/actions/sam-deploy
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_MAP: ${{ vars.MODEL_MAP }}
          GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}

  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      account_a_id: ${{ steps.org.outputs.ACCOUNT_A_ID }}
      account_b_id: ${{ steps.org.outputs.ACCOUNT_B_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check emails
        env:
          EMAIL_A: ${{ vars.EMAIL_A || secrets.EMAIL_A }}
          EMAIL_B: ${{ vars.EMAIL_B || secrets.EMAIL_B }}
        run: |
          if [ -z "$EMAIL_A" ] || [ -z "$EMAIL_B" ]; then
            echo "::error::Set repository variables EMAIL_A and EMAIL_B (two unused addresses) so push can create accounts A and B."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create or reuse accounts A and B
        id: org
        env:
          EMAIL_A: ${{ vars.EMAIL_A || secrets.EMAIL_A }}
          EMAIL_B: ${{ vars.EMAIL_B || secrets.EMAIL_B }}
        run: ./scripts/bootstrap-org.sh

  deploy-members:
    name: Deploy member ${{ matrix.account }}
    needs: bootstrap
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: a
            id: ${{ needs.bootstrap.outputs.account_a_id }}
          - account: b
            id: ${{ needs.bootstrap.outputs.account_b_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and deploy
        uses: ./.github/actions/sam-deploy
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::${{ matrix.id }}:role/OrganizationAccountAccessRole
          role-session-name: gha-deploy-${{ matrix.account }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_MAP: ${{ vars.MODEL_MAP }}
          GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}
