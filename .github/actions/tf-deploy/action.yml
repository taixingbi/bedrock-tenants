name: Terraform deploy
description: Package and terraform apply the Bedrock inference Lambda
inputs:
  role-to-assume:
    required: true
    description: Management-account role assumed via GitHub OIDC
  member-role-arn:
    required: false
    default: ""
    description: Optional member OrganizationAccountAccessRole to assume after OIDC
  role-session-name:
    required: false
    default: gha-deploy
runs:
  using: composite
  steps:
    - name: Check required secrets
      shell: bash
      env:
        DEPLOY_ROLE: ${{ inputs.role-to-assume }}
      run: |
        missing=0
        if [ -z "$DEPLOY_ROLE" ]; then
          echo "::error::Set repository variable AWS_ROLE_ARN to the management-account deploy role."
          missing=1
        fi
        if [ -z "$API_KEY" ]; then
          echo "::error::Missing repository secret INFERENCE_API_KEY"
          missing=1
        fi
        exit "$missing"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Assume deploy role (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Assume member role
      if: ${{ inputs.member-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.member-role-arn }}
        role-session-name: ${{ inputs.role-session-name }}
        role-chaining: true
        role-skip-session-tagging: true
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy
      shell: bash
      run: ./scripts/tf-deploy.sh
